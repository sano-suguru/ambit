name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Not a gate: records Ambit's own coverage numbers on every PR without
      # failing the build on them (DESIGN.md §4.3's coverage KPI is still
      # being brought down, not yet enforced).
      - name: Coverage report on Ambit's own source (non-gating)
        run: node src/cli/main.ts check src --coverage
        continue-on-error: true
