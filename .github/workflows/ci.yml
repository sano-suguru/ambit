name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `actions/checkout` fetches a single commit by default, and two
          # things here need more. The `ambit diff` step needs `HEAD~1`, and
          # `test/e2e.diff.test.ts` resolves a pinned SHA from this
          # repository's own history — a shallow clone would fail the test
          # gate before the diff step ever ran. Full history is what covers
          # both; a depth chosen for `HEAD~1` alone does not.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # The gate: a contract violation in Ambit's own source fails the build.
      # `--format github` annotates the offending line with the whole call path
      # (DESIGN.md §5.1 / §6), and `--coverage` keeps recording the numbers
      # docs/status.md tracks. Not `--strict`: measured, `check src --strict`
      # exits 1 on four unresolved-call warnings in the connection layer — see
      # docs/status.md, "Ambit's own source".
      - name: Contract check on Ambit's own source
        run: node src/cli/main.ts check src --coverage --format github

      # The second gate: authority that grew since the base commit and has no
      # approval fails the build (DESIGN.md §6.3). A pull request that adds
      # authority on purpose passes by adding a line to `ambit.approvals.md`,
      # which is then part of the diff a reviewer reads — so the gate is
      # enforced rather than reported. `--format github` annotates each
      # increase at its own declaration: `::error` for one with nothing
      # approving it, carrying the line to add, and `::notice` for one that
      # was approved, carrying the reason.
      #
      # On a `pull_request` event `HEAD~1` is the base tip, so this compares
      # the base branch against the pull request's tree — which is the
      # comparison the ledger's "only in the comparison that adds it" rule is
      # written for. The `push` to main afterwards rechecks the same pair when
      # the branch was squashed or merged as one commit, which is how this
      # repository merges; a rebase-merge of several commits would make
      # `HEAD~1` the second-to-last of them instead.
      - name: Authority diff against the base commit
        run: node src/cli/main.ts diff HEAD~1 src --format github
